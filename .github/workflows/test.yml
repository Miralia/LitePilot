name: Unit Tests

on:
  # 指向 main 的 PR 与推送都跑全量单测，作为合并门禁
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Unit Tests
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.in', '**/requirements-dev.in', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 单测需要开发/测试依赖；运行时入口 requirements.in 不携带测试与构建辅助工具。
          pip install -r requirements-dev.in

      - name: Run tests
        timeout-minutes: 10
        run: |
          # tests/run.py 以 pytest 跑 tests 全量；tests/conftest.py 在收集前把 CONFIG_DIR
          # 指向临时库并建表；CI 额外生成覆盖率报告，便于后续补测和回归分析。
          set -o pipefail
          python -m coverage erase
          python -m coverage run tests/run.py 2>&1 | tee pytest-output.log
          python -m coverage report 2>&1 | tee coverage-report.txt
          python -m coverage json
          python -m coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            pytest-output.log
            coverage-report.txt
            coverage.xml
            coverage.json
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    name: Frontend Quality Gate
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable Corepack for Yarn cache lookup
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.3'
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install frontend dependencies
        working-directory: web
        run: corepack yarn install --frozen-lockfile

      - name: Run frontend lint
        working-directory: web
        run: corepack yarn lint

      - name: Run frontend typecheck
        working-directory: web
        run: corepack yarn typecheck

      - name: Run frontend tests
        working-directory: web
        run: corepack yarn test:run

      - name: Build frontend production assets
        working-directory: web
        run: corepack yarn build
