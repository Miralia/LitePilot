name: 问题反馈
description: 报告 LitePilot 主程序或前端问题
title: "[错误报告]: 请在此处简单描述你的问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请确认以下信息：
        1. 提交前请先在现有 Issue 中搜索，避免重复反馈。
        2. 请描述清楚复现步骤，并附上脱敏后的日志或 `moviepilot doctor --json` 摘要。
        3. 不要上传 API Token、Cookie、密码、服务器地址或其他敏感信息。
  - type: checkboxes
    id: ensure
    attributes:
      label: 确认
      description: 在提交 Issue 之前，请确认你已经阅读并确认以下内容
      options:
        - label: 我正在使用当前 main 分支或已说明所使用的具体提交。
          required: true
        - label: 我已经搜索过现有 Issue，确认问题没有被重复提出。
          required: true
        - label: 我已经修改标题，将标题中的“请在此处简单描述你的问题”替换为实际问题。
          required: true
  - type: input
    id: version
    attributes:
      label: 当前程序版本
      description: 遇到问题时程序所在的版本号或 Git 提交哈希
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 当前程序运行环境
      options:
        - Linux systemd
        - Linux 其他方式
        - macOS
        - Windows
        - 其他
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 问题类型
      description: 你在以下哪个部分碰到了问题
      options:
        - 后端运行问题
        - 前端界面问题
        - 整理入库问题
        - 识别刮削问题
        - 部署或升级问题
        - 其他问题
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 请详细描述你碰到的问题、复现步骤、预期行为和实际行为
      placeholder: "问题描述"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 发生问题时的日志或诊断信息
      description: 请粘贴脱敏后的相关日志或 `moviepilot doctor --json` 摘要
      render: bash
