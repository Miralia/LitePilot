name: 功能改进
description: 提出 LitePilot 功能改进建议
title: "[Feature Request]: "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        请说明你希望添加或改进的功能。

        LitePilot 只保留「识别、刮削、整理、媒体库、通知」核心链路；站点、订阅、插件市场、工作流和 AI Agent 等上游模块不在本分支支持范围内。
  - type: input
    id: version
    attributes:
      label: 当前程序版本
      description: 目前使用的程序版本或 Git 提交哈希
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 当前程序运行环境
      options:
        - Linux systemd
        - Linux 其他方式
        - macOS
        - Windows
        - 其他
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 功能改进类型
      description: 你需要在下面哪个方面改进功能
      options:
        - 识别刮削
        - 整理入库
        - 媒体库联动
        - 消息通知
        - 前端体验
        - 部署运维
        - 其他
    validations:
      required: true
  - type: textarea
    id: feature-request
    attributes:
      label: 功能改进
      description: 请详细描述需要改进或者添加的功能，以及它解决什么问题
      placeholder: "功能改进"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可以列举相关参考资料，不要上传敏感配置、Cookie、Token 或私有服务器信息
      placeholder: "参考资料"
